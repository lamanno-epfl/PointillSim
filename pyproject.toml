[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pointillsim"
version = "0.1.0"
description = "Rule-based Simulation Engine for Imaging-based Spatial Transcriptomics"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "La Manno Lab", email = "gioele.lamanno@epfl.ch"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = ["spatial transcriptomics", "simulation", "HybISS", "imaging"]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "pandas>=1.3",
    "shapely>=2.0",
    "scikit-learn>=1.0",
    "matplotlib>=3.5",
    "tqdm>=4.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0",
    "black>=24.0",
    "isort>=5.13",
    "bandit>=1.7",
    "pydocstyle>=6.3",
]
anndata = [
    "anndata>=0.8",
    "scipy>=1.7",
]
spatialdata = [
    "spatialdata>=0.1",
    "geopandas>=0.12",
    "anndata>=0.8",
]

[project.urls]
Homepage = "https://github.com/lamanno-epfl/PointillSim"
Repository = "https://github.com/lamanno-epfl/PointillSim"
Issues = "https://github.com/lamanno-epfl/PointillSim/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pointillsim*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["pointillsim"]
skip_gitignore = true

[tool.bandit]
exclude_dirs = ["tests", "notebooks"]
skips = ["B101", "B311"]  # Skip assert and random warnings

[tool.pydocstyle]
convention = "numpy"
add-ignore = ["D100", "D104", "D105", "D107"]
match = "(?!test_).*\\.py"
match-dir = "pointillsim"
